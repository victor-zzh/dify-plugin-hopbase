model: kimi-k3
label:
  en_US: Kimi K3
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 1048576
parameter_rules:
  - name: temperature
    use_template: temperature
    min: 0
    max: 1
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 32768
