model: gpt-5.6-sol
label:
  en_US: GPT-5.6 Sol
model_type: llm
features:
  - agent-thought
  - tool-call
  - multi-tool-call
  - stream-tool-call
  - vision
model_properties:
  mode: chat
  context_size: 1050000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: max_tokens
    use_template: max_tokens
    default: 4096
    min: 1
    max: 128000
  - name: reasoning_effort
    label:
      en_US: Reasoning effort
    type: string
    required: false
    help:
      en_US: How much the model reasons before answering. Leave empty for the model default.
    options:
      - low
      - medium
      - high
